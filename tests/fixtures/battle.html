<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>战斗接入 · 隔离验证</title><link rel="stylesheet" href="assets/css/battle.css"><style>
body{margin:0;padding:24px;font:15px system-ui;background:#f3f3e9;color:#31523e}button,select,input{font:inherit}button{cursor:pointer;padding:9px 13px;margin:4px;border:1px solid #a6b99b;border-radius:7px;background:#e7ebdd;color:#31523e}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.settings-card{padding:18px;border:1px solid #becbb4;border-radius:8px;background:#fffef8;margin:14px 0}.settings-section-title{font-size:24px}#settings-body{max-width:720px}#tavern-messages{min-height:130px;white-space:pre-wrap;line-height:1.8;margin:20px 0}#status{position:fixed;bottom:4px;background:#e7ebdd;padding:6px;z-index:16000}textarea{width:95%;padding:10px}#fixture-description{font-size:13px;color:#71816b}
</style></head><body><header><h2>战斗接入验证</h2><button id="preferences">偏好设置 · 战斗</button><button id="new-offer">生成模拟正文遭遇</button><button id="save-fail">切换保存失败</button><button id="network-fail">切换续写失败</button><span id="calls">模拟 API 调用：0</span></header><p id="fixture-description">独立测试存档；全部回复为模拟数据，不读取正式游戏存档，不连接 API。</p><div id="settings-body" hidden></div><div id="tavern-messages"></div><div class="tavern-input-bar"><textarea id="tavern-input" placeholder="战斗接入测试"></textarea></div><p id="status">就绪</p>
<script src="assets/js/preset-core.js"></script><script src="assets/js/tavern-core.js"></script><script src="assets/js/battle-engine.js"></script><script src="assets/js/battle-core.js"></script><script>
const KEY='doupo-battle-integration-fixture-v1';let failSave=false,failNetwork=false,calls=0;let saved;try{saved=JSON.parse(localStorage.getItem(KEY));}catch{}
var GameState=saved?.game||{player:{name:'萧炎',realm:'斗者二星',baseStats:{strength:8,endurance:5,speed:6},skills:[]},settings:{battle:{enabled:true,autoReport:false}}};
var tavernState={isLoading:false,isSending:false,activeChatId:'fixture-battle',chats:saved?.chats||[{id:'fixture-battle',messages:[],variables:{}}],tavernSettings:{id:'main'}};
let record=structuredClone({game:GameState,chats:tavernState.chats}),inTransaction=false;
function persist(){if(failSave)throw Error('模拟存储空间不足');localStorage.setItem(KEY,JSON.stringify(record));}
var db={chats:{async put(c){if(failSave)throw Error('模拟存储空间不足');record.chats=record.chats.map(x=>x.id===c.id?structuredClone(c):x);if(!inTransaction)persist();}},tavernSettings:{async put(s){if(failSave)throw Error('模拟存储空间不足');if(s.playerState)record.game.player=structuredClone(s.playerState);}},async transaction(mode,tables,fn){const old=structuredClone(record);inTransaction=true;try{await fn();persist();}catch(e){record=old;throw e;}finally{inTransaction=false;}}};
function getActiveChat(){return tavernState.chats[0];}function showToast(t){document.getElementById('status').textContent=t;}function saveToLocalStorage(){try{record.game=structuredClone(GameState);persist();return true;}catch{return false;}}
function render(){document.getElementById('tavern-messages').textContent=getActiveChat().messages.map(m=>(m.role==='user'?'你：':'正文：')+m.content).join('\n\n');document.getElementById('calls').textContent='模拟 API 调用：'+calls;BattleBridge.refresh();}
async function runTavernTurn(content,retry,type,meta){calls++;if(!retry){const user={id:crypto.randomUUID(),role:'user',content};BattleBridge.attachReport(getActiveChat(),user,meta);getActiveChat().messages.push(user);await db.chats.put(getActiveChat());}if(failNetwork){showToast('模拟 API 失败；战报已保存，可重试');render();return;}const answer={id:crypto.randomUUID(),role:'assistant',content:'劫掠者收起兵器，双方依照战斗结果结束交锋。'};BattleBridge.completeReport(getActiveChat(),answer);getActiveChat().messages.push(answer);await db.chats.put(getActiveChat());render();}
</script><script src="assets/js/battle-bridge.js"></script><script>
document.getElementById('preferences').onclick=()=>{const el=document.getElementById('settings-body');el.hidden=!el.hidden;if(!el.hidden)BattleBridge.settingsUI(el);};
document.getElementById('save-fail').onclick=()=>{failSave=!failSave;showToast('模拟保存失败：'+failSave);};document.getElementById('network-fail').onclick=()=>{failNetwork=!failNetwork;showToast('模拟续写失败：'+failNetwork);};
document.getElementById('new-offer').onclick=async()=>{if(BattleBridge.guard())return;const id=crypto.randomUUID(),learned='你已掌握震山掌，命中可以打断敌人的蓄力。',line='斗者一星的蒙面劫掠者横刀拦住你，向你发起挑战。',data={skills:[{name:'震山掌',effect:'interrupt',evidence:learned}],encounter:{enemyName:'蒙面劫掠者',realm:'斗者一星',evidence:line}},out=BattleCore.apply(GameState.player,data,learned+line,id,BattleBridge.cfg().enabled);GameState.player=out.player;getActiveChat().messages.push({id,role:'assistant',content:learned+'\n'+line});getActiveChat().battle=out.offer;await db.chats.put(getActiveChat());saveToLocalStorage();render();};render();
</script></body></html>
