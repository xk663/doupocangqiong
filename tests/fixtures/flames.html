var HEAVENLY_FLAMES=[{"id":"flame_1","rank":1,"name":"帝炎","color":"#ffdd00","desc":"异火榜首，万火汇聚的至尊之炎，关联陀舍古帝与异火吞噬进化的终极秘密。"},{"id":"flame_2","rank":2,"name":"虚无吞炎","color":"#332244","desc":"生于虚无，擅长吞噬，具有灵智。本体、子火与借用力量需加区分。"},{"id":"flame_3","rank":3,"name":"净莲妖火","color":"#ff88cc","desc":"乳白妖异，具净化与幻境之能；妖火空间、妖圣遗留与火婴关联不同阶段。"},{"id":"flame_4","rank":4,"name":"金帝焚天炎","color":"#ffaa00","desc":"古族传承异火，薰儿持有。金色火焰威能强大，传承与掌控皆有门槛。"},{"id":"flame_5","rank":5,"name":"生灵之焱","color":"#44dd44","desc":"翠绿之火，神农老人持有。擅长催生药材，施展需要种子并消耗力量。"},{"id":"flame_6","rank":6,"name":"八荒破灭焱","color":"#cc4400","desc":"黑色火焰，蕴含强大破坏力量，炎族火炫曾以此火迎战妖火空间中的强敌。"},{"id":"flame_7","rank":7,"name":"九幽金祖火","color":"#ccaa44","desc":"炎族传承相关的强大异火，炎烬曾将其与火山石焰融合，威能更进一步。"},{"id":"flame_8","rank":8,"name":"红莲业火","color":"#ee3333","desc":"火焰呈妖艳红莲之象，炎族火稚曾使用，是炎族掌握的强大异火之一。"},{"id":"flame_9","rank":9,"name":"三千焱炎火","color":"#ff8844","desc":"成形于星空，吸纳星辰之力，关联丹塔星域与强大恢复力。"},{"id":"flame_10","rank":10,"name":"九幽风炎","color":"#44cc88","desc":"药族人物曾使用的异火，关联药星极与万火长老等不同情节。"},{"id":"flame_11","rank":11,"name":"骨灵冷火","color":"#88ccff","desc":"森白火焰，极寒与炽热并存。药老的标志异火，后有师徒传承。"},{"id":"flame_12","rank":12,"name":"九龙雷罡火","color":"#cc88ff","desc":"焚炎谷传承异火，关联唐震与血魂印记；掌控需面对传承条件。"},{"id":"flame_13","rank":13,"name":"龟灵地火","color":"#886644","desc":"异火榜第十三，药族药天曾使用，曾出现在争夺净莲妖火的风波之中。"},{"id":"flame_14","rank":14,"name":"陨落心炎","color":"#ff4466","desc":"心火锻气，关联天焚炼气塔。成熟火与幼生火种是两条不同线索。"},{"id":"flame_15","rank":15,"name":"海心焰","color":"#4488ff","desc":"海蓝异火，曾由韩枫持有，后经魂殿体系流转；所有权随剧情变化。"},{"id":"flame_fire_cloud_water","rank":16,"name":"火云水炎","color":"#7089bb","desc":"异火榜第十六，炎族火耀长老曾使用；原文对其生态与能力着墨较少。"},{"id":"flame_16","rank":17,"name":"火山石焰","color":"#884422","desc":"异火榜第十七，炎烬曾将它与九幽金祖火融合使用。"},{"id":"flame_17","rank":18,"summary":"生于古老沙漠火焰龙卷的风眼，极热时节游移出现。风火化龙，旋卷之处化为火海。","name":"风怒龙炎","desc":"生于古老沙漠中的火焰龙卷风的风眼之中。不同于其他异火，没有固定的地点，而是在每年的最热的几天内，随机出现在沙漠中的任何一处，极其罕见。施展出时会形成龙卷风形态，风与火相结合，火焰高达数百米，像一条巨大的火龙咆哮着旋转前进，具有极强的破坏能力，所到之处化成一片火海","color":"#d88838","sourceType":"user-supplement","sourceLabel":"作者补充设定","sourceFile":"新建 文本文档 (2).txt"},{"id":"flame_18","rank":19,"name":"青莲地心火","color":"#44ccaa","desc":"地底岩浆中青莲孕育的异火，伴莲台而生，是萧炎收服的第一种异火。"},{"id":"flame_nether_poison","rank":20,"summary":"生于上古幽冥毒泽，吞食毒瘴成灵。火色偏绿，星火含剧毒，接近与融合皆极危险。","name":"幽冥毒火","desc":"存在于上古幽冥毒泽之中的火焰。经过毒泽中遮天毒瘴千万年的熏染，火焰燃食了无尽的毒瘴之气，百年成灵，千年成形，大成之时，其色偏绿，犹如鬼火一般在毒泽瘴气中穿行。由于火焰本身是毒瘴喂养成灵，含有剧毒，只要沾染片刻星火，便会身中剧毒，更别说是吞噬融合！也正是因为如此，很少有人去寻找这种异火，也就没有多少人知晓它的存在。","color":"#719d4b","sourceType":"user-supplement","sourceLabel":"作者补充设定","sourceFile":"新建 文本文档 (2).txt"},{"id":"flame_23","rank":21,"summary":"诞生于虚空，黑白双炎如阴阳双鱼交游。阳火蕴生机，阴火主毁灭，兼具生死之力。","name":"阴阳双炎","desc":"诞生于宇宙虚空之中，一黑一白两种颜色的火焰缠绕在一起，就犹如阴阳双鱼一般游动。阴阳便是自然法则，是孕育世间万物的本源。而诞生于本源之中的阴阳双炎便是本源所幻化出的其中一种火焰形态，充满生命和死亡的双重力量，阳火救人，生生不息，阴火杀人，尸骨无存。","color":"#a4adb8","sourceType":"user-supplement","sourceLabel":"作者补充设定","sourceFile":"新建 文本文档 (2).txt"},{"id":"flame_21","rank":22,"name":"万兽灵火","color":"#cc6644","desc":"古帝洞府异火广场及终战中出现；具体野外分布与生态资料有限。"},{"id":"flame_22","rank":23,"name":"玄黄炎","color":"#aaaa66","desc":"深黄色异火，古帝洞府异火广场中的火种已流失力量。"}];
