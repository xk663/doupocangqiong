<!doctype html><html lang="zh-CN"><head><base href="../../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地区扩展 · 隔离验收</title>
<style>#fixture-bar label{display:grid;gap:4px;min-width:0;flex:1}#fixture-bar select{width:100%;max-width:100%;min-width:0}</style>
<link rel="stylesheet" href="assets/css/world-map.css"><link rel="stylesheet" href="assets/css/world-regions.css"><link rel="stylesheet" href="assets/css/place-scenes.css"><link rel="stylesheet" href="assets/css/journal.css"><link rel="stylesheet" href="assets/css/residence.css">
<style>body{margin:0;background:#f4f3e8;font:16px/1.6 'Microsoft YaHei',sans-serif;color:#315b44}#fixture-bar{padding:10px 18px;background:#304d3a;color:#fff5db;display:flex;gap:12px;flex-wrap:wrap;align-items:center}#fixture-bar select,#fixture-bar button{font:inherit;padding:8px;color:#315b44}#fixture-state{padding:10px 18px;word-break:break-all}#game-view-worldmap{min-height:calc(100dvh - 150px);height:auto}#game-view-studio{height:calc(100dvh - 150px);overflow:auto}#fixture-chat{padding:24px}textarea{width:100%;min-height:250px;font:16px/1.8 sans-serif}#fixture-status{padding:8px 18px;background:#e6e9d8}#fixture-state{font:14px/1.6 monospace}:root{--font-serif:'SimSun',serif;--text-primary:#355e49;--text-muted:#79876e}[hidden]{display:none!important}</style>
<script src="tests/fixtures/region-map-preview-data.js"></script><script src="assets/js/world-flight-frames.js"></script><script src="assets/js/world-navigation.js"></script><script src="assets/js/world-core.js"></script><script src="assets/js/world-bridge.js"></script><script src="assets/js/world-regions.js"></script><script src="assets/js/place-scenes.js"></script><script src="assets/js/place-interactions.js"></script><script src="assets/js/world-ui.js"></script><script src="assets/js/tavern-core.js"></script><script src="assets/js/residence-core.js"></script><script src="assets/js/residence-art.js"></script><script src="assets/js/residence-ui.js"></script>
</head><body><nav id="fixture-bar"><strong>隔离验收 · 不读取主游戏存档或调用模型</strong><label>设置验收地点 <select id="fixture-place"></select></label><button id="fixture-map">地图</button><button id="fixture-residence">驻地交互</button></nav><div id="fixture-status" role="status">就绪</div><div id="game-view-worldmap"></div><div id="game-view-studio" hidden></div><section id="fixture-chat" hidden><h1>隔离行动草稿</h1><textarea id="tavern-input"></textarea><button id="fixture-clear">清空隔离草稿</button></section><output id="fixture-state"></output><script>
var GameState={phase:'game',player:{},settings:{}},WorldState={},GameTime={},tavernState={activeChatId:'region-fixture',isLoading:false,isSending:false,tavernSettings:{}};
var db={tavernSettings:{async put(){throw Error('隔离验收禁止存储');}}};function showToast(t){document.getElementById('fixture-status').textContent=t;}function saveToLocalStorage(){throw Error('隔离验收禁止存储');}
function switchGameView(id){for(const key of ['worldmap','studio'])document.getElementById('game-view-'+key).hidden=key!==id;document.getElementById('fixture-chat').hidden=id!=='tavern';if(id==='studio')ResidenceUI.render();if(id==='worldmap')WorldMapUI.mount(document.getElementById('game-view-worldmap'));}
let ctx;function commit(next){ctx=next;GameState.player=ctx.player;WorldState=ctx.worldState;GameTime=ctx.gameTime;document.getElementById('fixture-state').textContent=JSON.stringify({id:ctx.state.locationId,scene:ctx.state.scene,pose:ctx.state.pose,visits:ctx.state.visited,turn:ctx.state.turn,gold:ctx.economy.gold,vigor:ctx.state.vigor});}
const selector=document.getElementById('fixture-place');selector.innerHTML=WorldRegions.entries.filter(p=>!p.secret).map(p=>'<option value="'+p.id+'">'+p.regionName+' · '+p.name+'</option>').join('');
const resourceFixture=new URLSearchParams(location.search).get('resources'),limitedSupplies=resourceFixture==='limited',emptySupplies=resourceFixture==='empty';
function start(id){const n=WorldCore.node(DoupoWorldData,id),root=WorldCore.node(DoupoWorldData,n.root||n.id),state=WorldCore.initial(DoupoWorldData,id,'region-fixture');if(limitedSupplies||emptySupplies){state.vigor=emptySupplies?0:92;state.movementMode='convoy';}commit({state,player:{name:'隔离旅人',gender:'female',realm:'斗王·一星',skills:[],inventory:[{name:'干粮',qty:emptySupplies?0:limitedSupplies?3:100},{name:'水囊',qty:emptySupplies?0:limitedSupplies?1:100}],exploration:state},economy:{gold:emptySupplies?0:limitedSupplies?5:5000},gameTime:{year:1,month:9,day:15,hour:9,minute:0,totalHours:0},worldState:{location:root.name,specificSpot:n.name,weather:'晴 · 微风'},questSystem:{quests:[],completed:[],failed:[]}});document.getElementById('tavern-input').value='';showToast('隔离地点已设置；未改变任何真实存档。');switchGameView(document.getElementById('game-view-studio').hidden?'worldmap':'studio');}
const requested=new URLSearchParams(location.search).get('place');selector.value=WorldRegions.entries.some(p=>p.id===requested&&!p.secret)?requested:'wutan-market';
WorldMapBridge.configure({read:()=>ctx,isBusy:()=>false,commit,toast:showToast,onTalk:t=>{document.getElementById('tavern-input').value=t;switchGameView('tavern');}});selector.onchange=()=>start(selector.value);document.getElementById('fixture-map').onclick=()=>switchGameView('worldmap');document.getElementById('fixture-residence').onclick=()=>switchGameView('studio');document.getElementById('fixture-clear').onclick=()=>document.getElementById('tavern-input').value='';start(selector.value);
</script></body></html>
