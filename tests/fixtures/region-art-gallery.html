function render(){const r=regions.find(r=>r.id===select.value);if(!r)return;document.getElementById('count').textContent=regions.length+' 个地区有画景';gallery.innerHTML='<h1>'+esc(r.name)+' · 地图与各分支独立画景</h1><section>'+(r.mapReady?'<figure><div><img src="../../'+r.mapArt+'" alt="'+esc(r.name)+'地区地图">'+r.branches.filter(p=>!p.secret).map((p,i)=>'<i style="left:'+p.x+'%;top:'+p.y+'%" title="'+esc(p.name)+'">'+(i+1)+'</i>').join('')+'</div><figcaption><strong>'+esc(r.name)+' · 地区地图</strong><details><summary>分支坐标</summary>'+r.branches.map((p,i)=>'<p>'+(i+1)+' · '+esc(p.name)+'（'+p.x+'，'+p.y+'）</p>').join('')+'</details></figcaption></figure>':'')+r.branches.map(p=>'<figure data-place="'+p.id+'"><div><img src="../../'+p.art+'" alt="'+esc(p.name)+'">'+p.interactions.map((q,i)=>'<i style="left:'+q.x+'%;top:'+q.y+'%" title="'+esc(q.title)+'">'+(i+1)+'</i>').join('')+'</div><figcaption><strong>'+esc(p.name)+'</strong><details><summary>'+p.interactions.length+' 处交互详情</summary>'+p.interactions.map((q,i)=>'<p>'+(i+1)+' · '+esc(q.title)+'<br><small>'+esc(q.description)+'</small></p>').join('')+'</details></figcaption></figure>').join('')+'</section>';history.replaceState(null,'','?region='+r.id);}
const requested=new URLSearchParams(location.search).get('region');if(regions.some(r=>r.id===requested))select.value=requested;select.onchange=render;document.getElementById('points').onchange=e=>document.body.classList.toggle('hide-points',!e.target.checked);render();
</script></html>
