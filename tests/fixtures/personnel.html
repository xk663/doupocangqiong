<!doctype html><html lang="zh-CN"><head><base href="../../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交游手札 · 隔离验证</title><link rel="stylesheet" href="assets/css/journal.css"><link rel="stylesheet" href="assets/css/personnel.css"><style>*{box-sizing:border-box}body{margin:0;background:#f3f3e9}#game-view-personnel{height:100vh;overflow:auto}.fixture-modal{position:fixed;inset:0;background:#15382c88;display:grid;place-items:center;z-index:10}.fixture-modal>div{background:#f8f6ea;border-radius:18px;padding:26px;max-height:95vh;overflow:auto;width:min(680px,94vw)}#fixture-status{position:fixed;bottom:10px;left:10px;padding:10px;background:#f6e6bb;z-index:20}#tavern-input{width:100%;height:200px}button{cursor:pointer}</style><script src="assets/js/preset-core.js"></script><script src="assets/js/model-route-core.js"></script><script src="assets/js/tavern-core.js"></script><script src="assets/js/world-data.js"></script><script src="assets/js/beauty-art.js"></script></head><body><div id="game-view-personnel"></div><section id="fixture-chat" hidden><h1>隔离聊天草稿</h1><textarea id="tavern-input"></textarea><button onclick="document.getElementById('fixture-chat').hidden=true;document.getElementById('game-view-personnel').hidden=false;PersonnelUI.render()">回到手札</button></section><output id="fixture-status">隔离验证，不读取主游戏存档，不调用 API。</output><script>
const fixtureKey='doupo-personnel-fixture-v1';var GameState={phase:'game',player:JSON.parse(localStorage.getItem(fixtureKey)||'null')||{name:'云渊',realm:'斗之气 · 三段',soulRealm:'凡境',skills:[{name:'基础吐纳术'}],relationships:[{name:'萧薰儿',realm:'尚未探明',relation:'萧家相识',desc:'在坊市重逢，曾谈起药草与修行。'}],exploration:{trust:{'su-trader':1}}}},tavernState={activeChatId:'isolated-personnel',tavernSettings:{}};
