<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>预设工作台 · 隔离验证</title><link rel="stylesheet" href="assets/css/preset-workbench.css"><style>
:root{--bg-panel:#f7f6ee;--text-primary:#285647;--text-body:#3d5146;--text-muted:#78876c;--font-serif:"Noto Serif SC",SimSun,serif;--border-color:#dfe2d3}*{box-sizing:border-box}body{margin:0;padding:32px;background:#edeee3;color:var(--text-body);font-family:system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.settings-section-title{font:26px var(--font-serif);margin-bottom:20px}.settings-card{padding:20px;margin:18px 0;background:#fffef8;border:1px solid #dfe2d3;border-radius:12px}.form-input{padding:10px 12px;border:1px solid #d4dcca;background:#fffef8;color:#345345;border-radius:6px}.text-btn{border:0;background:transparent;padding:9px 12px;color:#456d57}.settings-action-btn{border:1px solid #bdcbb6;padding:11px 16px;border-radius:5px;background:#e7ebdd;color:#315b48}.modal-overlay{position:fixed;inset:0;background:#14392d55;display:flex;align-items:center;justify-content:center;padding:18px}.modal-content{position:relative;background:var(--bg-panel);padding:28px;max-height:93vh;overflow:auto;border:1px solid #d1d8c4;border-radius:14px;box-shadow:0 15px 60px #14392d30}.modal-close{position:absolute;top:8px;right:10px;border:0;background:none;color:#54735c;font-size:22px}#status{position:fixed;bottom:5px;left:10px;z-index:20;padding:6px 10px;background:#fffef4;border:1px solid #c3cfb6;font-size:12px}.fixture-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
@media(max-width:650px){body{padding:15px}.modal-overlay{padding:8px}.modal-content{padding:22px 15px}.preset-workbench{width:100%}}
</style></head><body><div class="fixture-toolbar"><button class="settings-action-btn" onclick="PresetUI.open('fixture')">打开预设工作台</button><button class="text-btn" onclick="failSave=!failSave;showToast(failSave?'模拟保存失败已开启':'模拟保存失败已关闭')">切换保存失败</button></div><div id="settings-body"></div><div id="modals-container"></div><div id="status">隔离测试 · 内存数据 · 不读取玩家存档 · 不调用 API</div>
<script src="assets/js/preset-core.js"></script><script src="assets/js/tavern-core.js"></script><script>
let failSave=false;
var GameState={settings:{apis:[{id:'fixture-openai',name:'兼容接口 · 隔离',backend:'openai',model:'fixture-model',models:['fixture-model']},{id:'fixture-gemini',name:'Gemini 原生 · 隔离',backend:'gemini',model:'gemini-3-fixture'},{id:'fixture-ollama',name:'Ollama · 隔离',backend:'ollama',model:'fixture-local'},{id:'fixture-kobold',name:'Kobold · 隔离',backend:'kobold',model:'fixture-local'}]}};
var tavernState={presets:[PresetCore.importPreset({name:'山河叙事 · 测试预设',temperature:.85,top_p:.95,top_k:40,min_p:.05,prompts:[{identifier:'main',name:'主提示词',role:'system',content:'以当前玩家角色展开故事。{{user}} 的行动由玩家决定。',forbid_overrides:true},{identifier:'worldInfoBefore',name:'世界书（前）',marker:true},{identifier:'chatHistory',name:'聊天历史',marker:true},{identifier:'jailbreak',name:'历史后指令',content:'维持人物动机与世界规则。'},{identifier:'library',name:'未插入示例',content:'此块不应进入请求'}],prompt_order:[{character_id:100000,order:[{identifier:'main',enabled:true}]},{character_id:100001,order:[{identifier:'main',enabled:true},{identifier:'worldInfoBefore',enabled:true},{identifier:'chatHistory',enabled:true},{identifier:'jailbreak',enabled:false}]}]},'fixture')],tavernSettings:{activePresetId:'fixture'}};
tavernState.chats=[{id:'fixture-chat',name:'隔离测试会话',presetId:'fixture',messages:[]}];tavernState.activeChatId='fixture-chat';
const presetRows=new Map(tavernState.presets.map(p=>[p.id,structuredClone(p)])),chatRows=new Map(tavernState.chats.map(c=>[c.id,structuredClone(c)]));let settingsRow=structuredClone(tavernState.tavernSettings);
var db={presets:{async put(p){if(failSave)throw Error('模拟存储额度不足');presetRows.set(p.id,structuredClone(p));},async delete(id){if(failSave)throw Error('模拟删除失败');presetRows.delete(id);}},chats:{async toArray(){return [...chatRows.values()].map(c=>structuredClone(c));},async put(c){if(failSave)throw Error('模拟存储额度不足');chatRows.set(c.id,structuredClone(c));}},tavernSettings:{async get(){return structuredClone(settingsRow);},async put(s){if(failSave)throw Error('模拟存储额度不足');settingsRow=structuredClone(s);}},async transaction(mode,tables,fn){const p=structuredClone(presetRows),c=structuredClone(chatRows),s=structuredClone(settingsRow);try{await fn();}catch(e){presetRows.clear();p.forEach((v,k)=>presetRows.set(k,v));chatRows.clear();c.forEach((v,k)=>chatRows.set(k,v));settingsRow=s;throw e;}}};
function getActiveChat(){return tavernState.chats.find(c=>c.id===tavernState.activeChatId);}async function applyActivePreset(id){await db.transaction('rw',[],async()=>{await db.chats.put({...getActiveChat(),presetId:id});await db.tavernSettings.put({...tavernState.tavernSettings,activePresetId:id});});getActiveChat().presetId=id;tavernState.tavernSettings.activePresetId=id;}

function getTavernApi(){return GameState.settings.apis[0];}function showToast(t){document.getElementById('status').textContent=t;}function renderSettingsTab(){PresetUI.list(document.getElementById('settings-body'));}function activatePresetOnly(id){tavernState.tavernSettings.activePresetId=id;renderSettingsTab();}
function showModal(html){const node=document.createElement('div');node.className='modal-overlay';node.id='fixture-modal-'+crypto.randomUUID();node.innerHTML='<div class="modal-content"><button class="modal-close" aria-label="关闭预设窗口">×</button>'+html+'</div>';node.querySelector('.modal-close').onclick=()=>closeModal(node.id);node.onclick=e=>{if(e.target===node)closeModal(node.id);};document.getElementById('modals-container').appendChild(node);}function closeModal(id){const el=document.getElementById(id);if(PresetUI.guardClose(el,()=>closeModal(id)))return;el?.remove();}function closeAllModals(){if(PresetUI.guardClose(null,closeAllModals))return;document.getElementById('modals-container').textContent='';}
function createPreset(overrides={}){return {...PresetCore.importPreset({name:'测试新预设',prompts:[{identifier:'main',role:'system',content:''}],prompt_order:[{character_id:100000,order:[{identifier:'main',enabled:true}]}]},crypto.randomUUID()),...overrides};}function createPresetPrompt(overrides={}){return {identifier:crypto.randomUUID(),name:'新提示词',content:'',role:'system',enabled:true,injection_depth:4,injection_position:0,injection_order:100,injection_trigger:[],...overrides};}
var TavernInspector={inspectPreset(p){showModal('<h2>草稿参数预览 · 未发送</h2><pre>'+TavernCore.escapeHtml(JSON.stringify(PresetCore.report(p,'openai'),null,2))+'</pre>');},inspect(){const p=tavernState.presets.find(p=>p.id===tavernState.tavernSettings.activePresetId),messages=TavernCore.composePrompt({plan:TavernCore.promptPlan({preset:p,userName:'测试旅人',lorebookMatches:[{bookName:'测试世界书',position:0,entry:{content:'测试事实'}}]}),userInput:'测试行动'}).messages;showModal('<h2>已保存预设请求 · 未发送</h2><pre>'+TavernCore.escapeHtml(JSON.stringify(messages,null,2))+'</pre>');}};
</script><script src="assets/js/preset-manager.js"></script><script src="assets/js/preset-ui.js"></script><script>renderSettingsTab();PresetUI.open('fixture');</script></body></html>
