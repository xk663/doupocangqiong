<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>模型路由警告 · 隔离验证</title>
<link rel="stylesheet" href="assets/css/model-route.css"><style>body{margin:0;background:#f1f1e8;color:#304c3e;font:16px/1.8 system-ui}main{max-width:850px;margin:32px auto;padding:0 20px}h1{font-size:25px}button{font:inherit;min-height:44px;margin:4px;padding:8px 14px;border:1px solid #b4c7ac;border-radius:7px;background:#fffef7;color:#34563d;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.mock-story{min-height:160px;padding:24px;border:1px solid #d3dcc9;border-radius:12px;background:#fffdf6;white-space:pre-wrap}#status{min-height:2em}code{overflow-wrap:anywhere}</style>
<script src="assets/js/preset-core.js"></script><script src="assets/js/model-route-core.js"></script><script src="assets/js/tavern-core.js"></script><script src="assets/js/model-route-ui.js"></script>
</head><body><main><h1>模型路由核对</h1><p>隔离验证 · 合成流式响应 · 不调用模型 API，不读取或写入玩家存档。</p><p>调用模型：<code>gemini-4-argon-high</code></p><div><button data-mode="mismatch">模拟模型被路由</button><button data-mode="match">模拟返回一致</button><button data-mode="unverified">模拟未披露模型</button><button id="cancel" disabled>停止输出</button></div><p id="status" role="status">等待验证</p><article id="story" class="mock-story" aria-label="模拟正文"></article><div id="record"></div><div id="notifications-container"></div></main>
<script>
let controller;
async function run(mode){
 const story=document.getElementById('story'),status=document.getElementById('status');story.textContent='';document.getElementById('record').replaceChildren();document.getElementById('model-route-warning')?.remove();
 controller=new AbortController();document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=true);document.getElementById('cancel').disabled=false;status.textContent='正在输出，完成前不显示路由警告…';
 const requested='gemini-4-argon-high',reported=mode==='match'?requested:'gemini-3.8-flash-high';let audit;
 const frames=['你在城门前停下脚步，','远处传来商贩的吆喝。','\n\n你决定先观察周围，再选择下一步行动。'].map((text,i)=>({candidates:[{content:{parts:[{text}]},...(i===2?{finishReason:'STOP'}:{})}]}));
 if(mode!=='unverified')frames.push({modelVersion:reported});
 const fetcher=async()=>new Response(new ReadableStream({async start(stream){for(const frame of frames){await new Promise(r=>setTimeout(r,160));if(controller.signal.aborted){stream.close();return;}stream.enqueue(new TextEncoder().encode('data:'+JSON.stringify(frame)+'\n\n'));}stream.close();}}),{headers:{'content-type':'text/event-stream'}});
 try{await TavernCore.request({backend:'gemini',url:'https://mock.invalid',model:requested},[],{signal:controller.signal,onModelAudit:value=>audit=value},chunk=>story.textContent+=chunk,fetcher);document.getElementById('record').appendChild(ModelRouteUI.record(audit));status.textContent='输出完成 · '+({mismatch:'检测到模型标识不一致',match:'返回模型标识一致',unverified:'接口未披露模型，无法核验'}[audit.status]);ModelRouteUI.notify(audit);}
 catch(error){status.textContent=error.name==='AbortError'?'输出已停止，没有完成本轮核对':'验证失败：'+error.message;}
 finally{document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=false);document.getElementById('cancel').disabled=true;}
}
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>run(button.dataset.mode));document.getElementById('cancel').onclick=()=>controller?.abort();
</script></body></html>
