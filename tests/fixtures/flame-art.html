<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>异火图像审阅</title><style>body{margin:20px;background:#101f1b;color:#eee4c9;font:14px sans-serif}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}nav a{color:#e7dbb7;padding:10px}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}figure{margin:0}img{width:100%;aspect-ratio:1.5;object-fit:contain;background:#081814;border-radius:6px}figcaption{padding:8px}small{color:#9db19d}</style></head><body><header><div><h1>异火图像审阅</h1><small>仅展示静态素材，不读取游戏数据</small></div><nav><a href="tests/fixtures/flame-art.html?page=1">01—08</a><a href="tests/fixtures/flame-art.html?page=2">09—16</a><a href="tests/fixtures/flame-art.html?page=3">17—23</a></nav></header><main></main><script>const names=['帝炎','虚无吞炎','净莲妖火','金帝焚天炎','生灵之焱','八荒破灭焱','九幽金祖火','红莲业火','三千焱炎火','九幽风炎','骨灵冷火','九龙雷罡火','龟灵地火','陨落心炎','海心焰','火云水炎','火山石焰','风怒龙炎','青莲地心火','幽冥毒火','阴阳双炎','万兽灵火','玄黄炎'];const page=Math.max(1,Math.min(3,Number(new URLSearchParams(location.search).get('page'))||1));document.querySelector('main').innerHTML=names.map((name,i)=>({name,rank:i+1})).slice((page-1)*8,page*8).map(f=>'<figure><img src="assets/images/flames/flame-'+String(f.rank).padStart(2,'0')+'.png" alt="'+f.name+'"><figcaption>'+String(f.rank).padStart(2,'0')+' · '+f.name+'</figcaption></figure>').join('');</script></body></html>
